# Protect kernel pointers and logs from unprivileged users.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Make common link-based privilege escalation techniques harder.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Do not route traffic unless the operator deliberately enables it for a lab.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

